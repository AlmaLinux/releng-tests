[project]
name = "post-check"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pytest>=8.0",
  "pytest-xdist>=3.5",
  "requests>=2.32",
  "requests-cache>=1.2",
  "defusedxml>=0.7",
  "python-gnupg>=0.5",
  "PyYAML>=6.0",
  "rpmfile>=2.1",
  # AlmaLinux 10.1 ships part of the repodata (the `plus` repo) with
  # `primary.xml.zst` — without a zstd decompressor these repos cannot be parsed.
  "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
  "types-requests",
  "types-PyYAML",
  "pytest-httpserver>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["post_check*"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Pin the rule set explicitly instead of inheriting ruff's default.
# The default is not stable across releases: 0.11 selected E4/E7/E9/F,
# 0.16 widened it, and because the dev extra only asks for `ruff>=0.6`
# the gate's strictness silently became a function of whatever pip
# happened to resolve — `make lint` passed on one machine and reported
# 60 findings on another, against identical source. Naming the rules
# here makes the result identical on every ruff that knows them.
#
# This is deliberately the set the codebase already satisfies, so the
# gate starts green and stays meaningful. Widening it is a separate,
# reviewable change: the extra rules in 0.16's default flag 60 places
# (mostly BLE001 blind-except, I001 import order, PLW1510 subprocess
# `check=`), several of which need a judgement call rather than an
# autofix.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# `rpmfile`, `defusedxml`, and `python-gnupg` ship no PEP-561 marker and
# no third-party stubs on PyPI. Without these overrides mypy fails the
# import on every run and drowns the real diagnostics in noise.
[[tool.mypy.overrides]]
module = ["rpmfile", "rpmfile.*", "defusedxml.*", "gnupg"]
ignore_missing_imports = true
